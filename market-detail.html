<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Debatic — รายละเอียดตลาด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<div id="root"></div>
<script src="shared/app.js"></script>
<script src="shared/i18n.js"></script>
<script>

// Anyone can open a market; logging in is only required to trade (placeTrade) or comment.
const loggedIn = Session.isLoggedIn();

let markets = loadMarkets();
let notifications = loadNotifications();
let activity = loadActivityLog();
let positions = loggedIn ? loadPositions() : [];
let balance = loggedIn ? loadBalance() : 0;
let tradeSide = qs('side')==='no' ? 'no' : 'yes';
let tradeMode = 'buy';
let lastTradeAmt = '';
let chartRange = 'all';
let comments = loadComments();
let detailTab = 'comments';
let commentDraft = '';
let replyOpenId = null;

const m0 = markets.find(x=>x.id===qs('id'));
document.getElementById('root').innerHTML = traderShell(m0?m0.category:null, Session.current(), balance, notifications.some(n=>!n.read));

function ownedShares(id, side){ const p = positions.find(x=>x.marketId===id && x.side===side && !x.settled); return p ? p.shares : 0; }
function setSide(id, side){ tradeSide = side; lastTradeAmt = ''; draw(); }
function setMode(id, mode){ tradeMode = mode; lastTradeAmt = ''; draw(); }
function setAmt(v){ lastTradeAmt = v; const el=document.getElementById('tradeAmt'); if(el) el.value=v; updateSummary(qs('id')); }
function setRange(id, r){ chartRange = r; draw(); }
function setDetailTab(t){ detailTab = t; replyOpenId = null; draw(); }
function marketComments(id){ return (comments[id] || []).slice().sort((a,b)=>b.ts-a.ts); }
function goLogin(){ requireLogin(); }
function postComment(id){
  if(!loggedIn){ goLogin(); return; }
  const el = document.getElementById('commentInput');
  const val = (el ? el.value : commentDraft || '').trim();
  if(!val) return;
  const user = Session.current();
  const list = comments[id] || (comments[id] = []);
  list.unshift({ id:'c'+Date.now()+Math.random().toString(36).slice(2,6), user:user.name, avatarLetter:user.avatarLetter, avatarColor:user.avatarColor, text:val, ts:Date.now(), likes:0, liked:false, replies:[] });
  saveComments(comments);
  commentDraft = '';
  draw();
}
function toggleReplyBox(cid){
  if(!loggedIn){ goLogin(); return; } replyOpenId = replyOpenId===cid ? null : cid; draw(); }
function postReply(id, cid){
  const el = document.getElementById('replyInput_'+cid);
  const val = (el ? el.value : '').trim();
  if(!val) return;
  const list = comments[id] || [];
  const c = list.find(x=>x.id===cid);
  if(!c) return;
  const user = Session.current();
  c.replies = c.replies || [];
  c.replies.push({ id:'r'+Date.now()+Math.random().toString(36).slice(2,6), user:user.name, avatarLetter:user.avatarLetter, avatarColor:user.avatarColor, text:val, ts:Date.now() });
  saveComments(comments);
  replyOpenId = null;
  draw();
}
function toggleLikeComment(id, cid){
  if(!loggedIn){ goLogin(); return; }
  const list = comments[id] || [];
  const c = list.find(x=>x.id===cid);
  if(!c) return;
  c.liked = !c.liked;
  c.likes = (c.likes||0) + (c.liked ? 1 : -1);
  saveComments(comments);
  draw();
}
function commentItemHtml(id, c){
  return `<div class="comment-item">
    <div class="avatar" style="width:32px;height:32px;font-size:12.5px;background:${c.avatarColor||userColor(c.user)}">${esc(c.avatarLetter||c.user[0].toUpperCase())}</div>
    <div class="comment-body">
      <div class="comment-head"><span class="comment-user">${esc(c.user)}</span><span class="comment-time">${timeAgo(c.ts)}</span></div>
      <div class="comment-text">${esc(c.text)}</div>
      <div class="comment-actions">
        <button class="${c.liked?'liked':''}" onclick="toggleLikeComment('${id}','${c.id}')">${c.liked?'♥':'♡'} ถูกใจ${c.likes?' ('+c.likes+')':''}</button>
        <button onclick="toggleReplyBox('${c.id}')">ตอบกลับ</button>
      </div>
      ${(c.replies&&c.replies.length) ? `<div class="comment-replies">${c.replies.map(r=>`
        <div class="comment-item">
          <div class="avatar" style="width:26px;height:26px;font-size:11px;background:${r.avatarColor||userColor(r.user)}">${esc(r.avatarLetter||r.user[0].toUpperCase())}</div>
          <div class="comment-body">
            <div class="comment-head"><span class="comment-user">${esc(r.user)}</span><span class="comment-time">${timeAgo(r.ts)}</span></div>
            <div class="comment-text">${esc(r.text)}</div>
          </div>
        </div>`).join('')}</div>` : ''}
      ${replyOpenId===c.id ? `<div class="reply-compose">
        <input id="replyInput_${c.id}" type="text" placeholder="ตอบกลับ ${esc(c.user)}..." onkeydown="if(event.key==='Enter'){postReply('${id}','${c.id}')}">
        <button class="btn btn-primary btn-sm" onclick="postReply('${id}','${c.id}')">ตอบกลับ</button>
      </div>` : ''}
    </div>
  </div>`;
}
function commentsTabHtml(m){
  const list = marketComments(m.id);
  const me = Session.current();
  if(!me) return `
    <div class="comment-compose" style="justify-content:space-between;">
      <span class="sub">${tx('เข้าสู่ระบบเพื่อแสดงความคิดเห็นและตอบกลับ','Log in to comment and reply')}</span>
      <button class="btn btn-primary btn-sm" onclick="goLogin()">เข้าสู่ระบบ</button>
    </div>
    ${list.length ? list.map(c=>commentItemHtml(m.id,c)).join('') : emptyState('💬','ยังไม่มีความคิดเห็น','เป็นคนแรกที่แสดงความคิดเห็นในตลาดนี้')}`;
  return `
    <div class="comment-compose">
      <div class="avatar" style="width:32px;height:32px;font-size:12.5px;${avatarStyle(me.avatarColor, me.avatarImage)}">${avatarLabel(me.avatarLetter, me.avatarImage)}</div>
      <input id="commentInput" type="text" placeholder="เพิ่มความคิดเห็น..." value="${esc(commentDraft)}" oninput="commentDraft=this.value" onkeydown="if(event.key==='Enter'){postComment('${m.id}')}">
      <button class="btn btn-primary btn-sm" onclick="postComment('${m.id}')">โพสต์</button>
    </div>
    ${list.length ? list.map(c=>commentItemHtml(m.id,c)).join('') : emptyState('💬','ยังไม่มีความคิดเห็น','เป็นคนแรกที่แสดงความคิดเห็นในตลาดนี้')}
  `;
}
function updateSummary(id){
  const m = markets.find(x=>x.id===id);
  const el = document.getElementById('tradeSummary');
  if(!el) return;
  if(tradeMode==='sell') el.innerHTML = sellSummaryHtml(m, tradeSide, Number(lastTradeAmt)||0, ownedShares(id, tradeSide));
  else el.innerHTML = tradeSummaryHtml(m, tradeSide, Number(lastTradeAmt)||0);
}

function placeTrade(id){
  // Not logged in → go log in / sign up, then come straight back to this market and side.
  if(!loggedIn){
    const back = 'market-detail.html?id='+encodeURIComponent(id)+'&side='+tradeSide;
    location.href = 'login.html?next='+encodeURIComponent(back);
    return;
  }
  markets = loadMarkets(); // re-read so a market that just hit its close time can't be traded
  const m = markets.find(x=>x.id===id);
  if(!isTradingOpen(m)){ toast('ตลาดนี้ปิดรับการเทรดแล้ว', true); draw(); return; }
  const side = tradeSide;
  if(tradeMode==='sell'){
    const pos = positions.find(p=>p.marketId===id && p.side===side && !p.settled);
    const owned = pos ? pos.shares : 0;
    const qty = Math.min(Number(document.getElementById('tradeAmt').value)||0, owned);
    if(qty<=0){ toast('กรุณาระบุจำนวนหุ้นที่ต้องการขาย', true); return; }
    const quote = ammSellQuote(m, side, qty);
    const grossProceeds = quote.proceeds;
    const sellFeePct = loadSettings().sellFeePct || 0;
    const sellFee = grossProceeds * sellFeePct/100;
    const proceeds = grossProceeds - sellFee;
    balance += proceeds;
    applySidePriceCents(m, side, quote.newSideCents);
    const fraction = qty/pos.shares;
    pos.cost -= pos.cost*fraction;
    pos.shares -= qty;
    if(pos.shares < 0.0001) positions = positions.filter(p=>p!==pos);
    m.volume += grossProceeds;
    m.history.push({t:m.history.length, yes:m.yesPrice});
    activity.unshift({ user:'คุณ', action:'sold', side, marketId:id, amount:proceeds, time:'เมื่อสักครู่' });
    lastTradeAmt = '';
    const sideName = sideLabel(m, side);
    toast(tx('ขาย '+qty.toFixed(2)+' หุ้น “'+sideName+'” สำเร็จ ได้รับ '+money(proceeds)+(sellFee>0?' (ค่าธรรมเนียม '+money(sellFee)+')':'')+' แล้ว',
             'Sold '+qty.toFixed(2)+' “'+sideName+'” shares for '+money(proceeds)+(sellFee>0?' (fee '+money(sellFee)+')':'')));
    saveBalance(balance); savePositions(positions); saveMarkets(markets); saveActivityLog(activity);
    syncBalancePill(balance);
    draw();
    return;
  }
  const amount = Number(document.getElementById('tradeAmt').value);
  if(!amount || amount<=0){ toast('กรุณาระบุจำนวนเงินที่จะเทรด', true); return; }
  if(amount > balance){ toast('จำนวนเงินเกินยอดคงเหลือที่ใช้ได้ของคุณ', true); return; }
  const feePct = loadSettings().feePct || 0;
  const fee = amount * feePct/100;
  const net = amount - fee;
  const quote = ammBuyQuote(m, side, net);
  const shares = quote.shares;
  balance -= amount;
  applySidePriceCents(m, side, quote.newSideCents);
  let pos = positions.find(p=>p.marketId===id && p.side===side && !p.settled);
  if(pos){ const totalCost=pos.cost+amount, totalShares=pos.shares+shares; pos.avgPrice=totalCost/totalShares; pos.shares=totalShares; pos.cost=totalCost; }
  else { positions.push({ marketId:id, side, shares, avgPrice:amount/shares, cost:amount }); }
  m.volume += amount;
  m.history.push({t:m.history.length, yes:m.yesPrice});
  activity.unshift({ user:'คุณ', action:'bought', side, marketId:id, amount, time:'เมื่อสักครู่' });
  lastTradeAmt = '';
  const sideName = sideLabel(m, side);
  toast(tx('ซื้อ '+shares.toFixed(2)+' หุ้น “'+sideName+'” ด้วยเงิน '+money(amount)+(fee>0?' (ค่าธรรมเนียม '+money(fee)+')':'')+' แล้ว',
           'Bought '+shares.toFixed(2)+' “'+sideName+'” shares for '+money(amount)+(fee>0?' (fee '+money(fee)+')':'')));
  saveBalance(balance); savePositions(positions); saveMarkets(markets); saveActivityLog(activity);
  syncBalancePill(balance);
  draw();
}

// Tagging from the header button (or any other page) fires this — redraw so the button flips.
window.addEventListener('debatic:tagchange', ()=>{ draw(); toast(isTagged(qs('id')) ? 'ติดแท็กตลาดนี้แล้ว — ดูได้ที่ “ตลาดที่ติดแท็ก” ในหน้าตลาด' : 'เอาออกจากตลาดที่ติดแท็กแล้ว'); });

// A market hitting its close time while this page is open → reload the data and lock the panel.
window.addEventListener('debatic:marketsclosed', ()=>{ markets = loadMarkets(); draw(); });

function draw(){
  const m = markets.find(x=>x.id===qs('id'));
  if(!m){
    document.getElementById('view').innerHTML = emptyState('404','ไม่พบตลาดนี้','รหัสตลาดนี้ไม่มีอยู่ในระบบทดลองนี้') +
      `<div style="text-align:center;"><a class="btn btn-primary" href="index.html">กลับไปหน้าตลาด</a></div>`;
    return;
  }
  const closed = m.status==='resolved';
  const halted = m.status==='closed';
  const relatedAct = activity.filter(a=>a.marketId===m.id).slice(0,6);
  const ranges = [['1w','1W'],['1m','1M'],['all','All']];
  document.getElementById('view').innerHTML = `
    <a class="sub" href="index.html?cat=${encodeURIComponent(m.category)}" style="display:inline-block;margin-bottom:10px;">← ${catTh(m.category)}</a>
    <div class="detail-grid">
      <div>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px;">
          ${catIcon(m)}
          <h1 style="font-size:22px;flex:1;min-width:0;">${esc(m.question)}</h1>
          ${detailTagBtn(m.id)}
        </div>
        <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;">
          ${closed ? `<span class="badge ${m.outcome==='yes'?'badge-yes':'badge-no'}">ตัดสินแล้ว: ${esc(sideLabel(m, m.outcome))}</span>`
            : halted ? `<span class="badge badge-warn">ปิดรับการเทรดแล้ว · รอตัดสินผล</span>`
            : `<span class="badge badge-accent">เปิดอยู่</span><span class="badge">ปิดรับใน <span data-countdown="${m.id}">${closeCountdownText(m)}</span></span>`}
          <span class="badge">ปิดรับ ${esc(formatCloseMoment(m))}</span>
          ${m.featured?'<span class="badge badge-accent">แนะนำ</span>':''}
        </div>
        <div class="price-row"><span class="big" style="color:${m.yesPrice>=50?'var(--yes-strong)':'var(--no-strong)'}">${pct(m.yesPrice)}</span><span class="sub">${tx(`โอกาสที่จะเป็น “${esc(sideLabel(m,'yes'))}” ในตอนนี้`, `chance of “${esc(sideLabel(m,'yes'))}” right now`)}</span></div>
        <div class="range-tabs">${ranges.map(r=>`<button class="${chartRange===r[0]?'active':''}" onclick="setRange('${m.id}','${r[0]}')">${r[1]}</button>`).join('')}</div>
        <div class="chart-wrap card" style="padding:14px 14px 4px;">${priceChart(m.history, {range:chartRange})}</div>
        <div class="stat-row">
          <div class="stat"><span class="v mono">${money(m.volume)}</span><span class="k">ปริมาณ</span></div>
          <div class="stat"><span class="v mono">${m.traders}</span><span class="k">ผู้เทรด</span></div>
          <div class="stat"><span class="v mono">${m.createdBy}</span><span class="k">สร้างโดย</span></div>
        </div>
        ${orderBookHtml(m)}
        <h3 style="font-size:15.5px;margin-bottom:8px;">กติกาการตัดสิน</h3>
        <div class="prose"><p>${esc(m.rules)}</p></div>
        <div class="detail-tabs">
          ${[['comments','ความคิดเห็น ('+marketComments(m.id).length+')'],['holders','ผู้ถือรายใหญ่'],['status','สถานะ'],['activity','กิจกรรม']]
            .map(t=>`<button class="detail-tab ${detailTab===t[0]?'active':''}" onclick="setDetailTab('${t[0]}')">${t[1]}</button>`).join('')}
        </div>
        <div class="detail-tabpanel">
          ${detailTab==='comments' ? commentsTabHtml(m)
            : detailTab==='holders' ? topHoldersHtml(m)
            : detailTab==='status' ? holderStatusHtml(m)
            : (relatedAct.length ? relatedAct.map(a=>activityItem(a, markets)).join('') : emptyState('—','ยังไม่มีกิจกรรม','เป็นคนแรกที่เทรดตลาดนี้'))}
        </div>
      </div>
      <div class="detail-side">
        <div class="trade-panel card" style="padding:18px;">${closed ? closedPanelHtml(m) : halted ? awaitingPanelHtml(m) : tradePanelHtml(m, tradeSide, balance, lastTradeAmt, tradeMode, ownedShares(m.id, tradeSide))}</div>
        ${sideHotListHtml(markets, m.id)}
      </div>
    </div>
  `;
}
draw();
wireSearch();

</script>
</body>
</html>
