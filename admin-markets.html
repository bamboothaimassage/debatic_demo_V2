<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Debatic — จัดการตลาด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<div id="root"></div>
<script src="shared/app.js"></script>
<script>

let markets = loadMarkets();
let pending = loadPendingSuggestions();
let editingId = null;
let amImageData = null; // pending uploaded logo for the "create market" form, before it's saved
let editImageData = {}; // pending uploaded/removed logo per market id, while its edit row is open
document.getElementById('root').innerHTML = adminShell('admin-markets.html', ADMIN_ACCOUNT);

function uploadMarketImage(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    amImageData = reader.result;
    const el = document.getElementById('amImagePreview');
    if(el) el.innerHTML = catIcon({ image: amImageData });
  };
  reader.readAsDataURL(file);
}
function uploadEditMarketImage(id, input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    editImageData[id] = reader.result;
    const el = document.getElementById('edImgPreview_'+id);
    if(el) el.innerHTML = catIcon({ image: reader.result });
  };
  reader.readAsDataURL(file);
}
function resetEditMarketImage(id){
  editImageData[id] = null;
  const m = markets.find(x=>x.id===id);
  const el = document.getElementById('edImgPreview_'+id);
  if(el) el.innerHTML = catIcon({ category: m.category });
}


/* ---------- outcome button labels (ชื่อปุ่มผลลัพธ์) ----------
   Lets the admin rename the two sides of a market — e.g. ขึ้น / ลง (Up / Down) instead of
   ใช่ / ไม่ — in Thai and English. Saved on the market as m.sideLabels and shown on every
   player-facing button, badge and toast through sideLabel() in shared/app.js. When the
   labels are left at ใช่ / ไม่ (Yes / No) nothing is stored, so the default applies. */
function presetIdFor(labels){
  const hit = SIDE_LABEL_PRESETS.find(p=>p.yes.th===labels.yes.th && p.yes.en===labels.yes.en && p.no.th===labels.no.th && p.no.en===labels.no.en);
  return hit ? hit.id : 'custom';
}
function sideLabelPreviewHtml(labels){
  return `<span class="btn btn-sm btn-yes">${esc(labels.yes.th)} · ${esc(labels.yes.en)} 57¢</span><span class="btn btn-sm btn-no">${esc(labels.no.th)} · ${esc(labels.no.en)} 43¢</span>`;
}
function sideLabelFieldsHtml(prefix, m){
  const labels = { yes: sideLabelPair(m,'yes'), no: sideLabelPair(m,'no') };
  const preset = presetIdFor(labels);
  const input = (key, side, lang, ph, label) =>
    `<div class="field"><label for="${prefix}${key}">${label}</label><input id="${prefix}${key}" type="text" maxlength="24" value="${esc(labels[side][lang])}" placeholder="${ph}" oninput="onSideLabelInput('${prefix}')"></div>`;
  return `<div class="field" style="margin:0;">
      <label for="${prefix}Preset">ชื่อปุ่มผลลัพธ์ (ปุ่มซื้อ/ขายที่ผู้เล่นเห็น)</label>
      <select id="${prefix}Preset" onchange="applySidePreset('${prefix}', this.value)">
        ${SIDE_LABEL_PRESETS.map(p=>`<option value="${p.id}" ${preset===p.id?'selected':''}>${p.name}</option>`).join('')}
        <option value="custom" ${preset==='custom'?'selected':''}>กำหนดเอง</option>
      </select>
      <div class="side-label-grid" style="margin-top:10px;">
        ${input('YesTh','yes','th','ใช่','ฝั่งที่ 1 (เขียว) · ไทย')}
        ${input('YesEn','yes','en','Yes','ฝั่งที่ 1 (เขียว) · English')}
        ${input('NoTh','no','th','ไม่','ฝั่งที่ 2 (แดง) · ไทย')}
        ${input('NoEn','no','en','No','ฝั่งที่ 2 (แดง) · English')}
      </div>
      <div class="side-label-preview" id="${prefix}Preview">${sideLabelPreviewHtml(labels)}</div>
      <div class="sub" style="font-size:11.5px;margin-top:6px;">เลือกชุดสำเร็จรูปหรือพิมพ์เองได้ ช่องที่เว้นว่างจะใช้ภาษาอีกฝั่งหรือค่าเริ่มต้น ใช่ / ไม่ (Yes / No) — ชื่อนี้จะแสดงบนปุ่ม ป้ายผลการตัดสิน และพอร์ตของผู้เล่นทันที</div>
    </div>`;
}
function readSideLabelInputs(prefix){
  const v = id => { const el = document.getElementById(prefix+id); return el ? el.value.trim() : ''; };
  return { yes:{ th:v('YesTh'), en:v('YesEn') }, no:{ th:v('NoTh'), en:v('NoEn') } };
}
// What gets saved on the market: null when the result is just the default ใช่ / ไม่.
function sideLabelsToSave(prefix){
  const raw = readSideLabelInputs(prefix);
  const probe = { sideLabels: raw };
  return hasCustomSideLabels(probe) ? { yes: sideLabelPair(probe,'yes'), no: sideLabelPair(probe,'no') } : null;
}
function refreshSideLabelPreview(prefix){
  const probe = { sideLabels: readSideLabelInputs(prefix) };
  const el = document.getElementById(prefix+'Preview');
  if(el) el.innerHTML = sideLabelPreviewHtml({ yes: sideLabelPair(probe,'yes'), no: sideLabelPair(probe,'no') });
}
function applySidePreset(prefix, id){
  const p = SIDE_LABEL_PRESETS.find(x=>x.id===id);
  if(p){
    const set = (k,v)=>{ const el=document.getElementById(prefix+k); if(el) el.value=v; };
    set('YesTh',p.yes.th); set('YesEn',p.yes.en); set('NoTh',p.no.th); set('NoEn',p.no.en);
  }
  refreshSideLabelPreview(prefix);
}
function onSideLabelInput(prefix){
  const sel = document.getElementById(prefix+'Preset');
  const probe = { sideLabels: readSideLabelInputs(prefix) };
  if(sel) sel.value = presetIdFor({ yes: sideLabelPair(probe,'yes'), no: sideLabelPair(probe,'no') });
  refreshSideLabelPreview(prefix);
}
function setOrDelete(obj, key, val){ if(val) obj[key] = val; else delete obj[key]; }

// Every action below (approve, resolve, feature, edit, unlist, create) saves the whole
// markets array back to Store — so a resolution or price change made here, or a trade
// made by a player, is the same shared snapshot everywhere instead of resetting per page.
function persistExtras(){ saveMarkets(markets); }

function approveSuggestion(id){
  const s = pending.find(x=>x.id===id);
  if(!s) return;
  pending = pending.filter(x=>x.id!==id);
  savePendingSuggestions(pending);
  markets.unshift({ id:s.id, category:s.category, question:s.question, yesPrice:s.yesPrice, yesPriceExact:s.yesPrice, volume:0,
    closes:s.closes, rules:s.rules, createdBy:s.submittedBy, status:'open', history:[{t:0,yes:s.yesPrice}],
    isNew:true, traders:0, featured:false, extra:true, frequency:FREQUENCIES[hashStr(s.id)%FREQUENCIES.length] });
  persistExtras();
  toast('อนุมัติกระทู้ “'+s.question+'” แล้ว — ผู้เล่นจะเห็นในหน้าตลาดทันที');
  draw();
}
function rejectSuggestion(id){
  const s = pending.find(x=>x.id===id);
  pending = pending.filter(x=>x.id!==id);
  savePendingSuggestions(pending);
  toast('ปฏิเสธคำแนะนำ'+(s?' “'+s.question+'”':'')+' แล้ว');
  draw();
}
function resolve(id, outcome){
  if(!canResolveMarkets(loadPreviewRole())){ toast('บทบาทนี้ไม่มีสิทธิ์ตัดสินผลตลาด', true); return; }
  const m = markets.find(x=>x.id===id);
  m.status = 'resolved'; m.outcome = outcome; m.yesPrice = outcome==='yes'?100:0; m.yesPriceExact = m.yesPrice;
  persistExtras();
  const settled = settleMarketPositions(m);
  toast('ตัดสินผล “'+m.question+'” เป็น “'+sideLabelPair(m, outcome).th+'” แล้ว'
    + (settled.count ? ' — จ่ายผลตอบแทน '+money(settled.payout)+' ให้ผู้ถือโพซิชันแล้ว' : ''));
  draw();
}
// Manual close / reopen (the automatic close at the set date+time lives in shared/app.js).
function closeTrading(id){
  const m = markets.find(x=>x.id===id);
  if(!m || m.status!=='open') return;
  m.status = 'closed'; m.closedAt = Date.now(); m.closedBy = 'manual';
  persistExtras();
  toast('ปิดรับการเทรด “'+m.question+'” แล้ว — ผู้เล่นซื้อขายไม่ได้จนกว่าจะเปิดอีกครั้ง');
  draw();
}
function reopenTrading(id){
  const m = markets.find(x=>x.id===id);
  if(!m || m.status!=='closed') return;
  const at = marketClosesAt(m);
  if(at!==null && at<=Date.now()){ toast('เวลาปิดรับของตลาดนี้ผ่านไปแล้ว — กด “แก้ไข” เพื่อเลื่อนวันและเวลาปิดรับก่อน แล้วตลาดจะเปิดอีกครั้งเอง', true); return; }
  m.status = 'open'; delete m.closedAt; delete m.closedBy;
  persistExtras();
  toast('เปิดรับการเทรด “'+m.question+'” อีกครั้งแล้ว');
  draw();
}
// The ticker in app.js closed something while this page was open → show it.
window.addEventListener('debatic:marketsclosed', ()=>{ markets = loadMarkets(); draw(); });
function unlist(id){
  markets = markets.filter(m=>m.id!==id);
  persistExtras();
  toast('ถอดตลาดออกแล้ว');
  draw();
}
function toggleFeature(id){
  if(!canFeatureMarkets(loadPreviewRole())){ toast('บทบาทนี้ไม่มีสิทธิ์ปักหมุดแนะนำตลาด', true); return; }
  const m = markets.find(x=>x.id===id);
  m.featured = !m.featured;
  persistExtras();
  toast(m.featured ? 'แนะนำในหน้าแรกแล้ว' : 'นำออกจากรายการแนะนำแล้ว');
  draw();
}
function toggleEdit(id){
  if(editingId) delete editImageData[editingId]; // discard any unsaved logo change when closing/switching rows
  editingId = editingId===id ? null : id;
  draw();
}
function saveEdit(id){
  const m = markets.find(x=>x.id===id);
  m.question = document.getElementById('edQ_'+id).value.trim() || m.question;
  m.rules = document.getElementById('edR_'+id).value.trim() || m.rules;
  m.closes = document.getElementById('edC_'+id).value || m.closes;
  m.closesTime = document.getElementById('edT_'+id).value || DEFAULT_CLOSE_TIME;
  // Moving the close time into the future reopens a market that had closed on its own.
  if(m.status==='closed' && m.closedBy==='auto' && marketClosesAt(m) > Date.now()){ m.status = 'open'; delete m.closedAt; delete m.closedBy; }
  m.frequency = document.getElementById('edF_'+id).value || m.frequency;
  setOrDelete(m, 'questionEn', document.getElementById('edQEn_'+id).value.trim());
  setOrDelete(m, 'rulesEn', document.getElementById('edREn_'+id).value.trim());
  setOrDelete(m, 'sideLabels', sideLabelsToSave('ed_'+id+'_'));
  if(Object.prototype.hasOwnProperty.call(editImageData, id)){
    m.image = editImageData[id];
    delete editImageData[id];
  }
  editingId = null;
  persistExtras();
  toast('อัปเดตตลาดแล้ว');
  draw();
}
function addMarket(){
  const q = document.getElementById('amQ').value.trim();
  if(!q){ toast('กรุณาตั้งคำถามของตลาด', true); return; }
  const yes = Number(document.getElementById('amYes').value)||50;
  markets.unshift({ id:'m'+Math.random().toString(36).slice(2,8), category:document.getElementById('amCat').value, question:q,
    yesPrice:yes, yesPriceExact:yes, volume:0, closes:document.getElementById('amDate').value, closesTime:document.getElementById('amTime').value||DEFAULT_CLOSE_TIME, rules:document.getElementById('amDesc').value.trim()||'กติกาการตัดสินตามที่อธิบายไว้ข้างต้น',
    createdBy:ADMIN_ACCOUNT.name, status:'open', history:[{t:0,yes}], isNew:true, traders:0, featured:false, extra:true, frequency:document.getElementById('amFreq').value,
    image:amImageData||null });
  const created = markets[0];
  setOrDelete(created, 'questionEn', document.getElementById('amQEn').value.trim());
  setOrDelete(created, 'rulesEn', document.getElementById('amDescEn').value.trim());
  setOrDelete(created, 'sideLabels', sideLabelsToSave('am'));
  document.getElementById('amQ').value=''; document.getElementById('amDesc').value='';
  amImageData = null;
  persistExtras();
  toast('สร้างตลาดแล้ว — ผู้เล่นจะเห็นในหน้าตลาดทันที');
  draw();
}
function draw(){
  const statusFilter = qs('status') || 'all';
  const shownMarkets = statusFilter==='all' ? markets : markets.filter(m=>m.status===statusFilter);
  document.getElementById('view').innerHTML = `
    <div class="view-header"><h1>จัดการตลาด</h1><div class="sub">ทั้งหมด ${markets.length} รายการ · เปิดอยู่ ${markets.filter(m=>m.status==='open').length} รายการ · ปิดรับแล้ว รอผล ${markets.filter(m=>m.status==='closed').length} รายการ</div></div>
    <div class="page-note">การตัดสินผลตลาดที่นี่คือการชำระผลจริงให้ทุกสถานะของผู้เทรด — เลือกฝั่งที่ชนะเมื่อทราบผลจริงในโลกจริงแล้ว ชื่อปุ่มของแต่ละฝั่ง (เช่น ใช่ / ไม่ หรือ ขึ้น / ลง) ตั้งได้ตอนสร้างหรือแก้ไขตลาด การแนะนำจะปักหมุดตลาดไว้บนสุดของหน้าแรก ตลาดที่สร้างหรืออนุมัติจากหน้านี้จะบันทึกไว้ในเบราว์เซอร์นี้และแสดงบนหน้าตลาดของผู้เล่นทันที (ยังไม่ใช่ฐานข้อมูลจริง — ทีมพัฒนาแบ็กเอนด์ของคุณจะเชื่อมส่วนนี้เข้ากับ API จริงภายหลัง)</div>
    ${!canResolveMarkets(loadPreviewRole()) ? `<div class="page-note" style="background:var(--warn-soft);color:var(--warn);">บทบาท “${ROLE_LABELS_TH[loadPreviewRole()]}” สร้างและแก้ไขตลาดได้ตามปกติ แต่การตัดสินผลและการปักหมุดแนะนำเป็นสิทธิ์ของผู้ดูแลระดับสูงขึ้นไป</div>` : ''}
    ${pending.length ? `
    <h3 style="font-size:15px;margin-bottom:8px;">รอตรวจสอบ <span class="badge badge-accent">${pending.length}</span></h3>
    <div class="card table-wrap" style="margin-bottom:24px;"><table>
      <tr><th>คำถาม</th><th>หมวดหมู่</th><th>ปิดรับ</th><th>ผู้เสนอ</th><th></th></tr>
      ${pending.map(s=>`<tr>
        <td>${esc(s.question)}<div class="sub" style="font-size:11.5px;margin-top:3px;">${esc(s.rules)}</div></td>
        <td>${catTh(s.category)}</td>
        <td class="sub">${s.closes}</td>
        <td class="sub">${esc(s.submittedBy)} · ${s.submittedAt}</td>
        <td><div style="display:flex;gap:6px;">
          <button class="btn btn-sm btn-yes" onclick="approveSuggestion('${s.id}')">อนุมัติ</button>
          <button class="btn btn-sm btn-no" onclick="rejectSuggestion('${s.id}')">ปฏิเสธ</button>
        </div></td>
      </tr>`).join('')}
    </table></div>
    ` : ''}
    <h3 style="font-size:15px;margin-bottom:8px;">สร้างตลาด</h3>
    <div class="card" style="max-width:680px;padding:20px;margin-bottom:24px;">
      <div class="field"><label for="amQ">คำถาม</label><input id="amQ" type="text" placeholder="___ จะเกิดขึ้นภายใน ___ หรือไม่?"></div>
      <div class="field"><label for="amQEn">คำถาม (ภาษาอังกฤษ · ไม่บังคับ)</label><input id="amQEn" type="text" placeholder="Will ___ happen by ___?"><div class="sub" style="font-size:11.5px;margin-top:4px;">แสดงเมื่อผู้เล่นเลือกภาษา EN — ถ้าเว้นว่างจะแสดงคำถามภาษาไทย</div></div>
      <div style="display:flex;gap:12px;">
        <div class="field" style="flex:1;"><label for="amCat">หมวดหมู่</label><select id="amCat">${CATEGORIES.map(c=>`<option value="${c}">${catTh(c)}</option>`).join('')}</select></div>
        <div class="field" style="flex:1;"><label for="amDate">วันที่ปิดรับ</label><input id="amDate" type="date" value="${defaultFutureDate(30)}"></div>
        <div class="field" style="flex:1;"><label for="amTime">เวลาปิดรับ (เวลาไทย)</label><input id="amTime" type="time" value="${DEFAULT_CLOSE_TIME}"></div>
        <div class="field" style="flex:1;"><label for="amYes">% ฝั่งที่ 1 เริ่มต้น</label><input id="amYes" type="number" min="1" max="99" value="50"></div>
        <div class="field" style="flex:1;"><label for="amFreq">ความถี่</label><select id="amFreq">${FREQUENCIES.map(f=>`<option value="${f}" ${f==='monthly'?'selected':''}>${freqTh(f)}</option>`).join('')}</select></div>
      </div>
      <div class="sub" style="font-size:11.5px;margin:-6px 0 14px;">เมื่อถึงวันและเวลาปิดรับ ระบบจะปิดการซื้อขายให้อัตโนมัติ (ผู้ดูแลยังกดปิดเองก่อนเวลาได้) จากนั้นค่อยตัดสินผลเมื่อทราบผลจริง</div>
      <div class="field"><label for="amDesc">กติกาการตัดสิน</label><textarea id="amDesc" placeholder="อธิบายวิธีและเวลาที่ตลาดนี้จะตัดสินผล พร้อมแหล่งอ้างอิง"></textarea></div>
      <div class="field"><label for="amDescEn">กติกาการตัดสิน (ภาษาอังกฤษ · ไม่บังคับ)</label><textarea id="amDescEn" placeholder="Resolution rules in English"></textarea></div>
      <div style="margin-bottom:16px;">${sideLabelFieldsHtml('am', null)}</div>
      <div class="field">
        <label>โลโก้ตลาด (ไม่บังคับ)</label>
        <div style="display:flex;align-items:center;gap:10px;">
          <div id="amImagePreview">${catIcon({ category: CATEGORIES[0] })}</div>
          <input id="amImageInput" type="file" accept="image/*" onchange="uploadMarketImage(this)">
        </div>
        <div class="sub" style="font-size:11.5px;margin-top:4px;">ถ้าไม่อัปโหลด ระบบจะแสดงไอคอนสีตามหมวดหมู่แทนโดยอัตโนมัติ</div>
      </div>
      <button class="btn btn-primary" onclick="addMarket()">+ สร้างตลาด</button>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <h3 style="font-size:15px;margin:0;">ตลาดทั้งหมด</h3>
      <div class="chips" style="margin:0;">
        <a class="chip ${statusFilter==='all'?'active':''}" href="admin-markets.html">ทั้งหมด</a>
        <a class="chip ${statusFilter==='open'?'active':''}" href="admin-markets.html?status=open">เปิดอยู่</a>
        <a class="chip ${statusFilter==='closed'?'active':''}" href="admin-markets.html?status=closed">ปิดรับแล้ว รอผล</a>
        <a class="chip ${statusFilter==='resolved'?'active':''}" href="admin-markets.html?status=resolved">ตัดสินผลแล้ว</a>
      </div>
    </div>
    <div class="card table-wrap" style="margin-top:8px;"><table>
      <tr><th>คำถาม</th><th>หมวดหมู่</th><th>ความถี่</th><th>สถานะ</th><th>ปริมาณ</th><th>ปิดรับ</th><th></th></tr>
      ${shownMarkets.length===0 ? `<tr><td colspan="7" style="text-align:center;padding:28px;">${emptyState('◧','ไม่มีตลาดในตัวกรองนี้','ลองเลือกตัวกรองอื่นด้านบน')}</td></tr>` : shownMarkets.map(m=>`<tr>
        <td><div style="display:flex;align-items:center;gap:10px;">${catIcon(m)}<div><a href="market-detail.html?id=${m.id}">${esc(m.question)}</a>${m.featured?' <span class="badge badge-accent">แนะนำ</span>':''}${hasCustomSideLabels(m)?`<div class="sub" style="font-size:11.5px;margin-top:3px;">ปุ่ม: ${esc(sideLabelPair(m,'yes').th)} / ${esc(sideLabelPair(m,'no').th)}</div>`:''}</div></div></td>
        <td>${catTh(m.category)}</td>
        <td class="sub">${freqTh(m.frequency)}</td>
        <td>${m.status==='open' ? '<span class="badge badge-accent">เปิดอยู่</span>'
          : m.status==='closed' ? `<span class="badge badge-warn">ปิดรับแล้ว รอผล</span><div class="sub" style="font-size:11px;margin-top:3px;">${m.closedBy==='manual'?'ปิดเอง':'ปิดอัตโนมัติ'}</div>`
          : `<span class="badge ${m.outcome==='yes'?'badge-yes':'badge-no'}">ตัดสินผล: ${esc(sideLabelPair(m, m.outcome).th)}</span>`}</td>
        <td class="mono">${money(m.volume)}</td>
        <td class="sub">${m.closes}<div style="font-size:11px;">${m.closesTime||DEFAULT_CLOSE_TIME} น.</div></td>
        <td><div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${m.status==='open' ? `<button class="btn btn-sm btn-outline" onclick="closeTrading('${m.id}')">ปิดรับเทรด</button>` : ''}
          ${m.status==='closed' ? `<button class="btn btn-sm btn-outline" onclick="reopenTrading('${m.id}')">เปิดรับอีกครั้ง</button>` : ''}
          ${m.status!=='resolved' && canResolveMarkets(loadPreviewRole()) ? `<button class="btn btn-sm btn-yes" onclick="resolve('${m.id}','yes')">ตัดสินเป็น “${esc(sideLabelPair(m,'yes').th)}”</button><button class="btn btn-sm btn-no" onclick="resolve('${m.id}','no')">ตัดสินเป็น “${esc(sideLabelPair(m,'no').th)}”</button>` : ''}
          ${canFeatureMarkets(loadPreviewRole()) ? `<button class="btn btn-sm btn-accent-outline" onclick="toggleFeature('${m.id}')">${m.featured?'ยกเลิกแนะนำ':'แนะนำ'}</button>` : ''}
          <button class="btn btn-sm" onclick="toggleEdit('${m.id}')">${iconGear()}${editingId===m.id?'ยกเลิก':'แก้ไข'}</button>
          <button class="btn btn-sm btn-ghost" onclick="unlist('${m.id}')">${iconTrash()}ถอดออก</button>
        </div></td>
      </tr>
      ${editingId===m.id ? `<tr class="row-expand"><td colspan="7"><div style="padding:12px;display:flex;flex-direction:column;gap:10px;max-width:640px;">
          <div class="field" style="margin:0;"><label>คำถาม</label><input id="edQ_${m.id}" type="text" value="${esc(m.question)}"></div>
          <div class="field" style="margin:0;"><label>คำถาม (ภาษาอังกฤษ · ไม่บังคับ)</label><input id="edQEn_${m.id}" type="text" value="${esc(m.questionEn||'')}" placeholder="Will ___ happen by ___?"></div>
          <div class="field" style="margin:0;"><label>กติกาการตัดสิน</label><textarea id="edR_${m.id}">${esc(m.rules)}</textarea></div>
          <div class="field" style="margin:0;"><label>กติกาการตัดสิน (ภาษาอังกฤษ · ไม่บังคับ)</label><textarea id="edREn_${m.id}" placeholder="Resolution rules in English">${esc(m.rulesEn||'')}</textarea></div>
          ${sideLabelFieldsHtml('ed_'+m.id+'_', m)}
          <div class="field" style="margin:0;">
            <label>โลโก้ตลาด</label>
            <div style="display:flex;align-items:center;gap:10px;">
              <div id="edImgPreview_${m.id}">${catIcon(m)}</div>
              <input type="file" accept="image/*" onchange="uploadEditMarketImage('${m.id}', this)">
              <button class="btn btn-sm btn-outline" type="button" onclick="resetEditMarketImage('${m.id}')">ใช้ไอคอนเริ่มต้น</button>
            </div>
          </div>
          <div style="display:flex;gap:12px;">
            <div class="field" style="margin:0;max-width:200px;"><label>วันที่ปิดรับ</label><input id="edC_${m.id}" type="date" value="${m.closes}"></div>
            <div class="field" style="margin:0;max-width:160px;"><label>เวลาปิดรับ (เวลาไทย)</label><input id="edT_${m.id}" type="time" value="${m.closesTime||DEFAULT_CLOSE_TIME}"></div>
            <div class="field" style="margin:0;max-width:200px;"><label>ความถี่</label><select id="edF_${m.id}">${FREQUENCIES.map(f=>`<option value="${f}" ${m.frequency===f?'selected':''}>${freqTh(f)}</option>`).join('')}</select></div>
          </div>
          <button class="btn btn-primary btn-sm" style="width:fit-content;" onclick="saveEdit('${m.id}')">บันทึกการเปลี่ยนแปลง</button>
        </div></td></tr>` : ''}`).join('')}
    </table></div>
  `;
}
draw();

</script>
</body>
</html>
